<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Jogo</title>
  
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Montserrat:wght@600;800&display=swap"
    rel="stylesheet">
  
</head>
<style>
  /* Variáveis de cor copiadas do classic.html */
  :root {
    --bg1: #ffb200;
    --bg2: #ff7300;
    --bg3: #a80000;
    --accent: #ffb200;
    --muted: rgba(255, 255, 255, 0.85);
    /* Cores usadas no menu para manter o visual */
    --menu-bg-color: #d75b00;
    --menu-accent-color: #ff914d;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', 'Inter', sans-serif; /* Usando as fontes do classic.html */
    color: white; 
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    /* Fundo de gradiente linear do classic.html */
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3) 100%);
  }

  /* Canvas para o efeito de partículas/brilho do classic.html */
  #particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* Container central */
  .container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 90%;
    max-width: 900px;
    z-index: 1; /* Garante que o menu fique sobre o canvas */
  }

  .top, .bottom {
    display: flex;
    gap: 20px;
  }

  /* Botões */
  .box {
    background-color: rgba(255, 255, 255, 0.08); /* Fundo mais sutil */
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 20px; 
    flex: 1;
    transition: all 0.3s ease;
    cursor: pointer;
    backdrop-filter: blur(5px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    border: 3px solid transparent; 
    outline: none; 
  }

  .box:hover {
    transform: translateY(-4px) scale(1.02);
    background-color: rgba(255, 255, 255, 0.15); /* Brilho mais sutil no hover */
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  }

  /* Estilo de foco para a navegação por teclado */
  .box.focused, .box:focus {
    border-color: var(--accent); /* Cor de destaque do classic.html */
    box-shadow: 0 0 0 4px rgba(255, 178, 0, 0.5), 0 8px 30px rgba(0,0,0,0.6);
    transform: scale(1.03);
  }


  /* Estilos de fonte (Desktop) */
  .jogar h1 {
    font-size: 70px;
    font-weight: 900;
    line-height: 1;
  }

  .jogar .sub {
    font-size: 30px; 
    opacity: 0.5;
    margin-top: 10px;
  }

  .online h2 {
    font-size: 30px;
    font-weight: 900;
  }

  .online .sub {
    font-size: 20px;
    opacity: 0.5;
    margin-top: 10px;
  }

  .small {
    font-size: 24px;
    font-weight: 900;
    padding: 20px;
    height: 120px;
  }

  /* ====================================================================== */
  /* RESPONSIVIDADE */
  /* ====================================================================== */
  @media (max-width: 768px) {
    .container {
        gap: 15px;
    }
    
    .top {
      flex-direction: column;
    }

    .bottom {
      flex-wrap: wrap;
    }

    .box {
        padding: 30px;
        border-radius: 15px;
    }

    /* Redução de fontes para telas menores */
    .jogar h1 {
        font-size: 48px; 
    }

    .jogar .sub {
        font-size: 24px;
        margin-top: 5px;
    }
    
    .online h2 {
        font-size: 26px;
    }

    .online .sub {
        font-size: 18px;
    }

    .small {
        font-size: 20px;
        padding: 15px;
        height: auto; 
    }

    /* Altera o layout dos botões .small para 50% de largura */
    .bottom .box {
      flex: 1 1 calc(50% - 10px); 
    }
  }

  /* Ajuste para telas muito pequenas */
  @media (max-width: 400px) {
    .box {
        padding: 20px;
    }
    .jogar h1 {
        font-size: 40px; 
    }
    .jogar .sub {
        font-size: 20px;
    }
    .online h2 {
        font-size: 22px;
    }
  }
</style>
<body>
  
  <canvas id="particles"></canvas>

  <div class="container">
    <div class="top">
      <div class="box jogar" onclick="window.location.href='classic.html'" tabindex="0">
        <h1>JOGAR</h1>
        <p class="sub">Classic</p>
      </div>
      <div class="box online" onclick="window.location.href='online.html'" tabindex="0">
        <h2>ONLINE</h2>
        <p class="sub">Em breve</p>
      </div>
    </div>

    <div class="bottom">
      <div class="box small" onclick="window.location.href='extras.html'" tabindex="0">EXTRAS</div>
      <div class="box small" onclick="window.location.href='users.html'" tabindex="0">USUÁRIOS</div>
    </div>
  </div>

  <script>
    // =========================================================
    // Lógica do Fundo (Partículas e Brilho) Copiada do classic.html
    // =========================================================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const COVER_SIZE = 600; // Mantendo a variável, embora não seja usada aqui

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Cria partículas tipo "quadradinhos brilhando"
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 4 + 1,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5,
        alpha: Math.random() * 0.5 + 0.3
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // efeito de brilho central
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 100,
        canvas.width / 2, canvas.height / 2, canvas.width / 1.2
      );
      // Usando cores do brilho do classic.html
      gradient.addColorStop(0, "rgba(255, 200, 0, 0.5)");
      gradient.addColorStop(0.4, "rgba(255, 120, 0, 0.3)");
      gradient.addColorStop(1, "rgba(255, 50, 0, 0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // partículas animadas
      for (let p of particles) {
        // Cor das partículas em tom alaranjado/amarelado
        ctx.fillStyle = `rgba(255, ${150 + Math.random() * 100}, 0, ${p.alpha})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      }

      requestAnimationFrame(animate);
    }
    animate();
    
    // =========================================================
    // Lógica de Navegação por Teclado (Setas e Enter)
    // =========================================================

    const boxes = document.querySelectorAll('.box');
    let focusedIndex = 0;

    function updateFocus(newIndex) {
      newIndex = Math.max(0, Math.min(boxes.length - 1, newIndex));

      boxes[focusedIndex].classList.remove('focused');

      focusedIndex = newIndex;
      boxes[focusedIndex].classList.add('focused');
      boxes[focusedIndex].focus(); 
    }

    if (boxes.length > 0) {
        updateFocus(0);
    }

    document.addEventListener('keydown', (e) => {
      let newIndex = focusedIndex;
      const totalBoxes = boxes.length;
      
      // Mapeamento lógico 2x2: [0] [1] / [2] [3]

      switch (e.key) {
        case 'ArrowUp':
        case 'Up':
          if (focusedIndex >= 2) {
            newIndex -= 2;
            e.preventDefault();
          }
          break;

        case 'ArrowDown':
        case 'Down':
          if (focusedIndex <= 1) {
            newIndex += 2;
            e.preventDefault();
          }
          break;

        case 'ArrowLeft':
        case 'Left':
          if (focusedIndex % 2 !== 0) {
            newIndex -= 1;
            e.preventDefault();
          }
          break;

        case 'ArrowRight':
        case 'Right':
          if (focusedIndex % 2 === 0 && focusedIndex < totalBoxes - 1) {
            newIndex += 1;
            e.preventDefault();
          }
          break;

        case 'Enter':
          e.preventDefault();
          boxes[focusedIndex].click();
          return;
        
        case 'Tab':
            setTimeout(() => {
                const activeElement = document.activeElement;
                if (activeElement && activeElement.classList.contains('box')) {
                    boxes[focusedIndex].classList.remove('focused');
                    focusedIndex = Array.from(boxes).indexOf(activeElement);
                    boxes[focusedIndex].classList.add('focused');
                }
            }, 50);
            return;
      }

      if (newIndex !== focusedIndex) {
        updateFocus(newIndex);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (boxes.length > 0) {
            updateFocus(0);
        }
    });

  </script>
</body>
</html>
